services:
  - type: web
    name: adetelz-forms
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /admin/login
    envVars:
      # You are asked for the values marked sync: false when creating the service.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL # e.g. https://abcdefgh.supabase.co
        sync: false
      - key: SUPABASE_SECRET_KEY # Supabase → Project Settings → API Keys → secret key
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_UPLOAD_MB # Supabase free plan limit per file
        value: "50"
      - key: TRUST_PROXY
        value: "1"
